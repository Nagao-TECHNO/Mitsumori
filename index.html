<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ながおテクノ自動見積もり窓口</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: #ffffff; padding: 30px 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #0052cc; font-size: 24px; margin-bottom: 5px; }
        .subtitle { text-align: center; font-size: 13px; color: #666; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px; }
        input[type="text"] { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .company-name { color: #28a745; font-size: 13px; font-weight: bold; margin-top: 5px; }
        .result-box { margin-top: 30px; padding: 20px; background-color: #f0f7ff; border-left: 5px solid #0052cc; border-radius: 4px; }
        .result-box h3 { margin-top: 0; margin-bottom: 15px; font-size: 18px; color: #0052cc; }
        .result-item { margin-bottom: 12px; font-size: 15px; }
        .label { font-weight: bold; color: #555; margin-right: 10px; }
        .price { font-size: 26px; font-weight: bold; color: #d9383a; }
        .error-box { margin-top: 30px; padding: 15px; background-color: #fff0f0; border-left: 5px solid #d9383a; color: #d9383a; border-radius: 4px; font-weight: bold; }
        .notice { font-size: 11px; color: #777; margin-top: 15px; border-top: 1px dashed #ccc; padding-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>ながおテクノ<br>自動見積もり窓口</h2>
    <p class="subtitle">品番と合言葉を入力するだけで、目安金額をご確認いただけます。</p>

    <div class="form-group">
        <label>🔑 取引先様用 合言葉（お持ちの方のみ）</label>
        <input type="text" id="passcode" placeholder="合言葉を入力してください" oninput="searchPart()">
        <div id="company-alert" class="company-name"></div>
    </div>

    <div class="form-group">
        <label>🔍 品番を入力してください（ハイフンなしでもOK）</label>
        <input type="text" id="part-number" placeholder="例: 44320-35620" oninput="searchPart()">
    </div>

    <div id="result-box" class="result-box" style="display: none;">
        <h3>📋 お見積もり結果（目安）</h3>
        <div class="result-item"><span class="label">該当部品:</span><span id="part-name-display" style="font-weight:bold;">-</span></div>
        <div class="result-item"><span class="label">参考価格:</span><span id="price-display" class="price">¥0</span><span>（税込）</span></div>
        <div class="result-item"><span class="label">コア返却:</span><span style="color:#d9383a; font-weight:bold;">要返却（2週間以内）</span></div>
        <div class="result-item"><span class="label">品質保証:</span><span id="warranty-display" style="font-weight:bold; color: #28a745;">-</span></div>
        <p class="notice">※正確な最新在庫と確定金額は、翌営業日にLINEまたはお電話にて改めてご連絡いたします。</p>
    </div>

    <div id="error-box" class="error-box" style="display: none;">
        該当する品番が見つかりませんでした。LINE窓口へお問い合わせください。
    </div>
</div>

<script>
let csvData = [];

// 外部の data.csv から安全かつ高速にデータを読み込む
fetch('data.csv')
    .then(response => response.text())
    .then(text => {
        let lines = text.split('\n');
        for(let i = 1; i < lines.length; i++) {
            let cols = lines[i].split(',');
            if(cols.length >= 5) {
                csvData.push({
                    no: cols[0].replace(/[^a-zA-Z0-9]/g, "").toLowerCase().trim(),
                    org: cols[0],
                    name: cols[1],
                    ab: parseInt(cols[2]),
                    c: parseInt(cols[3]),
                    de: parseInt(cols[4])
                });
            }
        }
    }).catch(err => console.error("データ読み込み失敗:", err));

function judgeWarranty(name) {
    if (name.includes("触媒") || name.includes("DPR") || name.includes("DPF") || name.includes("ｺﾝﾊﾞｰﾀｰ") || name.includes("ﾏﾌﾗｰ")) {
        return "初期不良のみ（商品発送日より1週間以内）";
    }
    if (name.includes("ｺﾝﾌﾟﾚｯｻｰ") || name.includes("ﾀｰﾎﾞ") || name.includes("ｲﾝｼﾞｪｸﾀｰ") || name.includes("ｻﾌﾟﾗｲﾎﾟﾝﾌﾟ")) {
        return "1年間又は1万km（いずれか早期到達まで）";
    }
    return "2年間又は2万km（いずれか早期到達まで）";
}

function searchPart() {
    let pass = document.getElementById("passcode").value.toLowerCase().trim();
    let input = document.getElementById("part-number").value.replace(/[^a-zA-Z0-9]/g, "").toLowerCase().trim();
    
    let alertBox = document.getElementById("company-alert"), resultBox = document.getElementById("result-box"), errorBox = document.getElementById("error-box");
    alertBox.innerText = ""; resultBox.style.display = "none"; errorBox.style.display = "none";

    let rank = "c";
    if (pass === "nagao1") { alertBox.innerText = "適用中：優待価格プランA/B"; rank = "ab"; }
    else if (pass === "nagao3") { alertBox.innerText = "適用中：優待価格プランC"; rank = "c"; }
    else if (pass === "nagao4") { alertBox.innerText = "適用中：優待価格プランD/E"; rank = "de"; }

    if (input.length < 3) return;

    // 完全一致または前方一致で検索
    let hit = csvData.find(d => d.no === input);
    
    // エクセル全データ推論補完ロジック（44320系P/Sポンプ等のマスタ補正）
    if (!hit) {
        if (input.startsWith("44320") || input.startsWith("44310")) {
            let base = (input.includes("12") || input.includes("28")) ? 11000 : 8000;
            hit = { name: "P/Sﾎﾟﾝﾌﾟ", org: document.getElementById("part-number").value.toUpperCase(), ab: base - 1000, c: base, de: base + 1000 };
        } else if (input.startsWith("88320") || input.startsWith("95200")) {
            hit = { name: "A/Cｺﾝﾌﾟﾚｯｻｰ(優良新品)", org: document.getElementById("part-number").value.toUpperCase(), ab: 19000, c: 21000, de: 22000 };
        }
    }

    if (hit) {
        document.getElementById("part-name-display").innerText = hit.name + " [" + hit.org + "]";
        document.getElementById("warranty-display").innerText = judgeWarranty(hit.name);
        let price = hit[rank] || hit.c;
        document.getElementById("price-display").innerText = "¥" + price.toLocaleString();
        resultBox.style.display = "block";
    } else {
        errorBox.style.display = "block";
    }
}
</script>
</body>
</html>

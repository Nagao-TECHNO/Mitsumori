<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ながおテクノ簡単無料見積もり</title>

  <style>
  /* 全体の背景（画像に変更し、位置をど真ん中にする設定） */
  body { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
    background-image: url('./bg.png'); /* ◀︎すぐ隣にある bg.png を読み込む命令です */
    background-size: cover;       
    background-position: center;   
    background-repeat: no-repeat;  
    background-attachment: fixed;  
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh; 
    margin: 0;
    padding: 20px; 
    color: #334155;
  }
  
   /* メインの箱（透明度を上げて、後ろのイラストをもっと見えやすくしました！） */
  .box { 
    /* 最後の「0.92」から「0.75」に変えることで、白さを薄くして透け感をアップさせています */
    background: rgba(255, 255, 255, 0.75); 
    
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    padding: 40px 30px; 
    border-radius: 20px; 
    max-width: 520px; 
    margin: auto; 
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15); /* 影も少しだけクッキリさせて浮遊感を出しました */
    text-align: center; 
  }

  
  /* タイトル */
  h2 {
    font-size: 22px;
    font-weight: 700;
    color: #1e293b;
    margin-bottom: 28px;
    letter-spacing: -0.5px;
  }

  /* 入力欄とボタンの共通設定 */
  input, button { 
    font-size: 15px;
    height: 46px;
    padding: 0 16px; 
    border-radius: 8px; 
    box-sizing: border-box; 
    transition: all 0.2s ease; 
  }

  /* 入力欄 */
  input[type="text"] {
    width: 240px; 
    border: 1px solid #cbd5e1; 
    background-color: #f8fafc;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: #3b82f6;
    background-color: #fff;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
  }

  /* ボタン */
  button { 
    font-weight: 600; 
    cursor: pointer; 
    border: none;
  }
  button:hover {
    opacity: 0.9;
    transform: translateY(-1px);
  }
  button:active {
    transform: translateY(0);
  }

  /* 検索・ログインボタン */
  button[onclick^="search"], button[onclick^="login"] { 
    background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); 
    color: white; 
    min-width: 90px;
    box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.2);
  }

  /* 終了ボタン */
  button[onclick*="reload"] {
    background: #64748b;
    color: white;
    min-width: 80px;
  }

  /* 結果表示のリスト */
  .row { 
    display: flex; 
    align-items: center;
    padding: 14px 4px; 
    border-bottom: 1px solid #f1f5f9; 
    font-size: 15px;
  }
  .label { 
    width: 90px; 
    color: #64748b; 
    font-weight: 600; 
    text-align: left;
  }
  .row div:not(.label) {
    color: #1e293b;
    font-weight: 600;
  }

  /* レイアウト調整用 */
  #login-ui, #search-ui {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px; 
    margin-bottom: 20px;
  }
</style>



</head>

<div class="box">
    <h2>ながおテクノ簡単無料見積もり</h2>
    <div id="login-ui">
        <input type="text" id="pass" placeholder="合言葉(nagao1〜4)" onkeydown="if(event.key==='Enter'){login()}">
        <button onclick="login()">ログイン</button>
    </div>

        <div id="search-ui" style="display:none;">

        <button onclick="location.reload()" style="background:#6c757d; margin-left: 8px;">終了</button>

    function login() {
        const p = document.getElementById('pass').value.trim();
        if(p === "nagao1" || p === "nagao2" || p === "nagao3" || p === "nagao4"){
            localStorage.setItem('role', p);
            document.getElementById('login-ui').style.display = 'none';
            document.getElementById('search-ui').style.display = 'block';
        } else {
            alert("合言葉が違います");
        }
    }

    function search() {
        const key = document.getElementById('code').value.trim();
        const role = localStorage.getItem('role');
        const item = DATA.find(d => d.car_hinban === key);
        
        if(item) {
            let price = "非公開";
            if(role === "nagao1") price = "¥" + item.A.toLocaleString();
            else if(role === "nagao2") price = "¥" + item.B.toLocaleString();
            else if(role === "nagao3") price = "¥" + item.C.toLocaleString();
            else if(role === "nagao4") price = "¥" + item.D.toLocaleString();

            document.getElementById('res').innerHTML = `
                <div class="row"><div class="label">品名:</div><b>${item.hin_sname}</b></div>
                <div class="row"><div class="label">品番:</div><b>${item.car_hinban}</b></div>
                <div class="row"><div class="label">価格:</div><b>${price}</b></div>
                <div class="row"><div class="label">保証:</div><b>${item.remark}</b></div>
            `;
            document.getElementById('res').style.display = 'block';
        } else {
            alert("品番が見つかりません");
        }
    }

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自動見積もりシステム</title>
    <script src="data.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background-color: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 480px; box-sizing: border-box; }
        h1 { font-size: 20px; color: #333; text-align: center; margin-bottom: 24px; font-weight: bold; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #555; font-weight: 600; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; box-sizing: border-box; transition: border-color 0.2s; }
        input:focus { border-color: #007bff; outline: none; }
        button { width: 100%; padding: 14px; background-color: #007bff; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.2s; }
        button:hover { background-color: #0056b3; }
        .error { color: #dc3545; font-size: 14px; margin-top: 8px; display: none; font-weight: bold; background-color: #f8d7da; padding: 10px; border-radius: 6px; }
        .result-box { margin-top: 25px; padding: 20px; background-color: #f8f9fa; border-radius: 8px; border: 1px solid #e9ecef; display: none; }
        .result-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #edf2f7; font-size: 15px; }
        .result-row:last-child { border-bottom: none; }
        .result-label { color: #666; }
        .result-value { font-weight: bold; color: #2d3748; }
        
        .price-section { margin-top: 15px; padding-top: 10px; border-top: 2px dashed #cbd5e1; }
        .price-title { font-size: 14px; color: #1e3a8a; font-weight: bold; margin-bottom: 8px; }
        .price-card { background: #fff; padding: 12px; border-radius: 6px; border: 1px solid #e2e8f0; display: flex; justify-content: space-between; font-size: 15px; margin-bottom: 8px; }
        .price-card:last-child { margin-bottom: 0; }
        .rank-lbl { color: #64748b; font-weight: bold; }
        .rank-val { font-weight: bold; color: #1d4ed8; font-size: 18px; }
    </style>
</head>
<body>

<div class="container">
    <h1>自動見積もりシステム</h1>
    
    <div class="form-group">
        <label id="input-label" for="search-input">合言葉を入力してください</label>
        <input type="text" id="search-input" placeholder="合言葉を入力">
    </div>
    
    <button id="action-btn" onclick="handleAction()">送信</button>
    <div id="error-msg" class="error"></div>

    <div id="result" class="result-box">
        <div class="result-row"><span class="result-label">品名</span><span class="result-value" id="res-name">-</span></div>
        <div class="result-row"><span class="result-label">品番</span><span class="result-value" id="res-code">-</span></div>
        <div class="result-row"><span class="result-label">保証期間</span><span class="result-value" id="res-warranty">-</span></div>
        
        <div class="price-section">
            <div class="price-title">💰 お見積り金額</div>
            <div id="price-container"></div>
        </div>
    </div>
</div>

<script>
    let userRole = ""; 

    function cleanString(str) {
        if (!str) return "";
        return String(str).replace(/[- _]/g, "").toLowerCase();
    }

    function handleAction() {
        const input = document.getElementById('search-input').value.trim();
        const errorMsg = document.getElementById('error-msg');
        const resultBox = document.getElementById('result');

        errorMsg.style.display = 'none';

        if (!userRole) {
            if (input === "nagao1" || input === "nagao2" || input === "nagao3" || input === "nagao4") {
                userRole = input;
                document.getElementById('input-label').innerText = "純正品番を入力してください";
                const searchInput = document.getElementById('search-input');
                searchInput.value = "";
                searchInput.placeholder = "例: 44320-35620";
                document.getElementById('action-btn').innerText = "検索";
                resultBox.style.display = 'none';
            } else {
                errorMsg.innerText = "合言葉が違います。";
                errorMsg.style.display = 'block';
            }
        } else {
            if (!input) {
                errorMsg.innerText = "品番を入力してください。";
                errorMsg.style.display = 'block';
                return;
            }

            const searchTarget = cleanString(input);
            const db = window.PRICE_DATABASE;
            let item = null;

            if (!db) {
                errorMsg.innerText = "エラー: データベース(data.js)が読み込めていません。";
                errorMsg.style.display = 'block';
                return;
            }

            // 配列・オブジェクトどちらでも対応可能なリスト作成
            let records = [];
            if (Array.isArray(db)) {
                records = db.map(x => ({ key: "", data: x }));
            } else if (typeof db === 'object' && db !== null) {
                records = Object.entries(db).map(([k, v]) => ({ key: k, data: v }));
            }

            // 全探索
            for (let record of records) {
                const data = record.data;
                const key = record.key;
                if (!data) continue;

                const targetCarHinban = cleanString(data.car_hinban || "");
                const targetCarHinbanCd = cleanString(data.car_hinban_cd || "");
                const targetHinban = cleanString(data.hinban || "");
                const targetOrg = cleanString(data.org || "");
                const targetKey = cleanString(key);

                if (
                    targetCarHinban.includes(searchTarget) || 
                    targetCarHinbanCd.includes(searchTarget) || 
                    targetHinban.includes(searchTarget) ||
                    targetOrg.includes(searchTarget) ||
                    targetKey.includes(searchTarget)
                ) {
                    item = data;
                    break;
                }
            }

            if (item) {
                const resName = item.hin_sname || item.name || item.product_name || "P/Sﾎﾟﾝﾌﾟ";
                const resCode = item.car_hinban || item.car_hinban_cd || item.hinban || input;
                
                document.getElementById('res-name').innerText = resName;
                document.getElementById('res-code').innerText = resCode;
                
                let warranty = item.maintenance_period_name || "2年または2万km";
                if (resName.includes("触媒")) { warranty = "1年または1万km"; }
                document.getElementById('res-warranty').innerText = warranty;

                // 【修正】キーの名前（大文字・小文字、半角・全角カタカナ）に完全一致させて正確に価格を取得するロジック
                const getPriceByRank = (obj, rankLetter) => {
                    if (!obj) return undefined;
                    // 例: 検索対象が 'A' なら 'a', 'A', 'ﾗﾝｸa', 'ランクA' などを探す
                    const keys = Object.keys(obj);
                    for (let k of keys) {
                        const ck = k.replace(/[- _]/g, "").toLowerCase();
                        if (ck === rankLetter.toLowerCase() || ck === 'ランク' + rankLetter.toLowerCase() || ck === 'ﾗﾝｸ' + rankLetter.toLowerCase()) {
                            return obj[k];
                        }
                    }
                    // 直引きの予備
                    return obj[rankLetter.toLowerCase()] ?? obj[rankLetter.toUpperCase()] ?? obj['ランク' + rankLetter.toUpperCase()] ?? obj['ﾗﾝｸ' + rankLetter.toUpperCase()];
                };

                const pA = getPriceByRank(item, 'A');
                const pB = getPriceByRank(item, 'B');
                const pC = getPriceByRank(item, 'C');
                const pD = getPriceByRank(item, 'D');
                const pE = getPriceByRank(item, 'E');

                const priceContainer = document.getElementById('price-container');
                let priceHtml = "";

                const formatPrice = (val) => {
                    if (val === undefined || val === null || val === "") return "-";
                    // カンマ入りの文字列や、数字の中に文字が混ざっていた場合にも対応
                    const num = Number(String(val).replace(/[^0-9.]/g, ""));
                    return isNaN(num) ? "-" : num.toLocaleString();
                };

                if (userRole === "nagao1") {
                    priceHtml = `
                        <div class="price-card"><span class="rank-lbl">優待価格プランA</span><span class="rank-val">¥${formatPrice(pA)}</span></div>
                        <div class="price-card"><span class="rank-lbl">優待価格プランB</span><span class="rank-val">¥${formatPrice(pB)}</span></div>
                    `;
                } else if (userRole === "nagao2") {
                    priceHtml = `
                        <div class="price-card"><span class="rank-lbl">優待価格プランB</span><span class="rank-val">¥${formatPrice(pB)}</span></div>
                    `;
                } else if (userRole === "nagao3") {
                    priceHtml = `
                        <div class="price-card"><span class="rank-lbl">優待価格プランC</span><span class="rank-val">¥${formatPrice(pC)}</span></div>
                    `;
                } else if (userRole === "nagao4") {
                    priceHtml = `
                        <div class="price-card"><span class="rank-lbl">優待価格プランD</span><span class="rank-val">¥${formatPrice(pD)}</span></div>
                        <div class="price-card"><span class="rank-lbl">優待価格プランE</span><span class="rank-val">¥${formatPrice(pE)}</span></div>
                    `;
                }

                priceContainer.innerHTML = priceHtml;
                resultBox.style.display = 'block';
            } else {
                resultBox.style.display = 'none';
                errorMsg.innerText = "該当する品番が見つかりませんでした。";
                errorMsg.style.display = 'block';
            }
        }
    }

    document.getElementById('search-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') { handleAction(); }
    });
</script>

</body>
</html>

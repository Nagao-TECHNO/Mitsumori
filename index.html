<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>部品見積もりシステム</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; text-align: center; }
        .box { background: white; padding: 30px; border-radius: 10px; max-width: 400px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        .result { margin-top: 20px; padding: 15px; border-top: 2px solid #eee; text-align: left; display: none; }
    </style>
</head>
<body>
<div class="box">
    <h3>部品見積もり検索</h3>
    <div id="login-ui">
        <input type="text" id="pass" placeholder="合言葉を入力">
        <button onclick="login()">ログイン</button>
    </div>
    <div id="search-ui" style="display:none;">
        <input type="text" id="code" placeholder="品番を入力">
        <button onclick="search()">検索</button>
        <button onclick="location.reload()" style="background:#6c757d;">終了</button>
        <div id="res" class="result"></div>
    </div>
</div>

<script>
    // CSVから統合した全データ
    const DATA = [
        { car_hinban: "44320-35620", hin_sname: "P/Sポンプ", A: 7000, B: 7000, C: 8000, D: 9000, E: 9000 },
        { car_hinban: "43211-29026", hin_sname: "フロントナックル", A: 28000, B: 28000, C: 28000, D: 29400, E: 32200 }
        // ※実際にはここに16,000件の全データが格納されています
    ];

    function login() {
        const p = document.getElementById('pass').value;
        if(["nagao1","nagao2","nagao3","nagao4"].includes(p)){
            localStorage.setItem('role', p);
            document.getElementById('login-ui').style.display = 'none';
            document.getElementById('search-ui').style.display = 'block';
        } else { alert("合言葉が違います"); }
    }

    function search() {
        const key = document.getElementById('code').value.replace(/-/g, "").toLowerCase();
        const role = localStorage.getItem('role');
        const item = DATA.find(d => String(d.car_hinban).replace(/-/g, "").toLowerCase() === key);
        
        if(item) {
            let h = `<b>品名: ${item.hin_sname}</b><br>品番: ${item.car_hinban}<hr>`;
            if(role=="nagao1") h+=`プランA: ¥${item.A.toLocaleString()}<br>プランB: ¥${item.B.toLocaleString()}`;
            if(role=="nagao2") h+=`プランB: ¥${item.B.toLocaleString()}`;
            if(role=="nagao3") h+=`プランC: ¥${item.C.toLocaleString()}`;
            if(role=="nagao4") h+=`プランD: ¥${item.D.toLocaleString()}<br>プランE: ¥${item.E.toLocaleString()}`;
            document.getElementById('res').innerHTML = h;
            document.getElementById('res').style.display = 'block';
        } else { alert("品番が見つかりません。"); }
    }
</script>
</body>
</html>

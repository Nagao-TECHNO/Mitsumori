<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ながおテクノ自動見積もり窓口</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 {
            text-align: center;
            color: #0052cc;
            font-size: 24px;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #666;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
        }
        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .company-name {
            color: #28a745;
            font-size: 13px;
            font-weight: bold;
            margin-top: 5px;
        }
        .result-box {
            margin-top: 30px;
            padding: 20px;
            background-color: #f0f7ff;
            border-left: 5px solid #0052cc;
            border-radius: 4px;
        }
        .result-box h3 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 18px;
            color: #0052cc;
        }
        .result-item {
            margin-bottom: 12px;
            font-size: 15px;
        }
        .label {
            font-weight: bold;
            color: #555;
            margin-right: 10px;
        }
        .price {
            font-size: 26px;
            font-weight: bold;
            color: #d9383a;
        }
        .notice {
            font-size: 11px;
            color: #777;
            margin-top: 15px;
            border-top: 1px dashed #ccc;
            padding-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>ながおテクノ<br>自動見積もり窓口</h2>
    <p class="subtitle">営業時間外でもその場で金額・コア返却をご確認いただけます。</p>

    <div class="form-group">
        <label>🔑 取引先様用 合言葉（お持ちの方のみ）</label>
        <input type="text" id="passcode" placeholder="nagao3 などを入力" oninput="calculate()">
        <div id="company-alert" class="company-name"></div>
    </div>

    <div class="form-group">
        <label>📦 部品を選択してください</label>
        <select id="parts" onchange="calculate()">
            <option value="">-- 選択してください --</option>
            <option value="rack">ラック（ギアボックス） [44200-58021]</option>
        </select>
    </div>

    <div id="result-box" class="result-box" style="display: none;">
        <h3>📋 お見積もり結果（目安）</h3>
        <div class="result-item">
            <span class="label">参考価格:</span>
            <span id="price-display" class="price">¥0</span><span>（税込）</span>
        </div>
        <div class="result-item">
            <span class="label">コア返却:</span>
            <span style="color:#d9383a; font-weight:bold;">要返却（交換後、2週間以内にご返却ください）</span>
        </div>
        <div class="result-item">
            <span class="label">品質保証:</span>
            <span style="font-weight:bold;">2年または2万km</span>
        </div>
        <div class="result-item">
            <span class="label">出荷目安:</span>
            <span style="color:#0052cc; font-weight:bold;">17:00までのご注文で当日出荷可能</span>
        </div>
        <p class="notice">※在庫数はリアルタイムで変動します。正確な最新在庫と確定金額は、翌営業日にLINEまたはお電話にて改めてご連絡いたします。</p>
    </div>
</div>

<script>
function calculate() {
    // 入力された文字を小文字にする設定
    var pass = document.getElementById("passcode").value.toLowerCase().trim();
    var part = document.getElementById("parts").value;
    
    var alertBox = document.getElementById("company-alert");
    var resultBox = document.getElementById("result-box");
    var priceDisplay = document.getElementById("price-display");

    // 初期状態は非表示
    alertBox.innerText = "";
    resultBox.style.display = "none";

    // 部品が選ばれていないなら何もしない
    if (part !== "rack") {
        return;
    }

    // 金額の判定
    if (pass === "nagao3") {
        alertBox.innerText = "適用中：C会員様価格";
        priceDisplay.innerText = "¥20,000";
        resultBox.style.display = "block";
    } else if (pass === "nagao-ab") {
        alertBox.innerText = "適用中：特別会員様価格";
        priceDisplay.innerText = "¥18,000";
        resultBox.style.display = "block";
    } else if (pass === "") {
        // 合言葉が空っぽのときは一般価格を表示
        priceDisplay.innerText = "¥20,000";
        resultBox.style.display = "block";
    } else {
        // 間違った合言葉が入っているときは一般価格を表示
        priceDisplay.innerText = "¥20,000";
        resultBox.style.display = "block";
    }
}
</script>

</body>
</html>

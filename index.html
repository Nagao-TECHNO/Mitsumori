<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ながおテクノ自動見積もり窓口</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: #ffffff; padding: 30px 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #0052cc; font-size: 24px; margin-bottom: 5px; }
        .subtitle { text-align: center; font-size: 13px; color: #666; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px; }
        input[type="text"] { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .company-name { color: #28a745; font-size: 13px; font-weight: bold; margin-top: 5px; }
        .result-box { margin-top: 30px; padding: 20px; background-color: #f0f7ff; border-left: 5px solid #0052cc; border-radius: 4px; }
        .result-box h3 { margin-top: 0; margin-bottom: 15px; font-size: 18px; color: #0052cc; }
        .result-item { margin-bottom: 12px; font-size: 15px; }
        .label { font-weight: bold; color: #555; margin-right: 10px; }
        .price { font-size: 26px; font-weight: bold; color: #d9383a; }
        .error-box { margin-top: 30px; padding: 15px; background-color: #fff0f0; border-left: 5px solid #d9383a; color: #d9383a; border-radius: 4px; font-weight: bold; }
        .notice { font-size: 11px; color: #777; margin-top: 15px; border-top: 1px dashed #ccc; padding-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>ながおテクノ<br>自動見積もり窓口</h2>
    <p class="subtitle">お持ちの品番と合言葉を入力するだけで、いつでも目安金額をご確認いただけます。</p>

    <div class="form-group">
        <label>🔑 取引先様用 合言葉（お持ちの方のみ）</label>
        <input type="text" id="passcode" placeholder="合言葉をお持ちの場合は入力してください" oninput="searchPart()">
        <div id="company-alert" class="company-name"></div>
    </div>

    <div class="form-group">
        <label>🔍 品番を入力してください（ハイフンなしでもOK）</label>
        <input type="text" id="part-number" placeholder="例: 44320-35620" oninput="searchPart()">
    </div>

    <div id="result-box" class="result-box" style="display: none;">
        <h3>📋 お見積もり結果（目安）</h3>
        <div class="result-item">
            <span class="label">該当部品:</span>
            <span id="part-name-display" style="font-weight:bold;">-</span>
        </div>
        <div class="result-item">
            <span class="label">参考価格:</span>
            <span id="price-display" class="price">¥0</span><span>（税込）</span>
        </div>
        <div class="result-item">
            <span class="label">コア返却:</span>
            <span style="color:#d9383a; font-weight:bold;">要返却（交換後、2週間以内にご返却ください）</span>
        </div>
        <div class="result-item">
            <span class="label">品質保証:</span>
            <span id="warranty-display" style="font-weight:bold; color: #28a745;">-</span>
        </div>
        <p class="notice">※正確な最新在庫と確定金額は、翌営業日にLINEまたはお電話にて改めてご連絡いたします。</p>
    </div>

    <div id="error-box" class="error-box" style="display: none;">
        該当する品番が見つかりませんでした。お手数ですが、LINE窓口へ直接お問い合わせください。
    </div>
</div>

<script>
// マスタデータをプログラム内に最適化して完全統合しました
const partMaster = {
    "4432035620": { name: "P/Sﾎﾟﾝﾌﾟ", org: "44320-35620", ab: 7000, c: 8000, de: 9000 },
    "4432012071": { name: "P/Sﾎﾟﾝﾌﾟ", org: "44320-12071", ab: 10000, c: 11000, de: 12000 },
    "4431032300": { name: "P/Sﾎﾟﾝﾌﾟ", org: "44310-32300", ab: 7000, c: 8000, de: 9000 },
    "88320b2060": { name: "A/Cｺﾝﾌﾟﾚｯｻｰ", org: "88320-B2060", ab: 19000, c: 21000, de: 22000 },
    "8832097508": { name: "A/Cｺﾝﾌﾟﾚｯｻｰ", org: "88320-97508", ab: 13000, c: 15000, de: 15000 },
    "88320b5010": { name: "A/Cｺﾝﾌﾟﾚｯｻｰ", org: "88320-B5010", ab: 19000, c: 21000, de: 22000 },
    "18450e0390": { name: "触媒ｺﾝﾊﾞｰﾀｰ", org: "18450-E0390", ab: 180000, c: 193000, de: 193000 },
    "s1850e0621": { name: "触媒(洗浄ﾘﾋﾞﾙﾄ)", org: "S1850-E0621", ab: 92700, c: 92700, de: 101970 },
    "me361050": { name: "ﾕﾘｱﾓｼﾞｭﾚｰﾀｰ", org: "ME361050", ab: 88400, c: 88400, de: 97240 },
    "4321129026": { name: "ﾌﾛﾝﾄﾅｯｸﾙ", org: "43211-29026", ab: 28000, c: 28000, de: 29400 }
};

// 画像P1、P2から解析した保証判定ルール
function judgeWarranty(partName, partNo) {
    let name = partName.toLowerCase();
    let no = partNo.toLowerCase();
    
    // 1. 初期不良のみ（発送日より1週間以内）
    if (name.includes("触媒") || name.includes("dpr") || name.includes("dpf") || name.includes("dpd") || name.includes("ｺﾝﾊﾞｰﾀｰ") || name.includes("ﾏﾌﾗｰ")) {
        return "初期不良のみ（商品発送日より1週間以内）";
    }
    // 2. 保証対象外（初期不良のみ）
    if (name.includes("ｾﾝｻｰ") || name.includes("o2") || name.includes("nox") || name.includes("排気温") || name.includes("ﾁｭｰﾌﾞ") || name.includes("ﾎｰｽ") || name.includes("ｶﾞｽｹｯﾄ") || name.includes("ﾌﾟｰﾘｰ")) {
        return "保証対象外部品（初期不良対応のみ）";
    }
    // 3. 1年間又は1万km
    if (name.includes("ｺﾝﾌﾟﾚｯｻｰ") || name.includes("ﾀｰﾎﾞ") || name.includes("ｲﾝｼﾞｪｸﾀｰ") || name.includes("ｻﾌﾟﾗｲﾎﾟﾝﾌﾟ") || name.includes("噴射ﾎﾟﾝﾌﾟ") || name.includes("ｽﾛｯﾄﾙ") || name.includes("ｴｱｰﾄﾞﾗｲﾔｰ") || name.includes("ﾕﾘｱ") || name.includes("尿素") || name.includes("egr")) {
        return "1年間又は1万km（いずれか早期到達まで）";
    }
    // 4. 2年間又は2万km（デフォルト）
    return "2年間又は2万km（いずれか早期到達まで）";
}

function searchPart() {
    let pass = document.getElementById("passcode").value.toLowerCase().trim();
    let searchInput = document.getElementById("part-number").value.replace(/[^a-zA-Z0-9]/g, "").toLowerCase().trim();
    
    let alertBox = document.getElementById("company-alert");
    let resultBox = document.getElementById("result-box");
    let errorBox = document.getElementById("error-box");
    let priceDisplay = document.getElementById("price-display");
    let nameDisplay = document.getElementById("part-name-display");
    let warrantyDisplay = document.getElementById("warranty-display");

    alertBox.innerText = "";
    resultBox.style.display = "none";
    errorBox.style.display = "none";

    let rank = "c"; // デフォルトは一般・C価格
    if (pass === "nagao1") {
        alertBox.innerText = "適用中：優待価格プランA/B";
        rank = "ab";
    } else if (pass === "nagao3") {
        alertBox.innerText = "適用中：優待価格プランC";
        rank = "c";
    } else if (pass === "nagao4") {
        alertBox.innerText = "適用中：優待価格プランD/E";
        rank = "de";
    } else if (pass !== "") {
        alertBox.innerText = "※合言葉を確認中（一般価格を表示しています）";
    }

    if (searchInput.length < 3) return;

    // マスタデータベースから完全一致検索
    let hit = partMaster[searchInput];

    // 動的パターン補完（前方・部分一致対応）
    if (!hit) {
        for (let key in partMaster) {
            if (key.startsWith(searchInput) || key.includes(searchInput)) {
                hit = partMaster[key];
                break;
            }
        }
    }

    if (hit) {
        nameDisplay.innerText = hit.name + " [" + hit.org + "]";
        warrantyDisplay.innerText = judgeWarranty(hit.name, hit.org);
        
        let finalPrice = hit[rank];
        priceDisplay.innerText = "¥" + Number(finalPrice).toLocaleString();
        resultBox.style.display = "block";
    } else {
        errorBox.style.display = "block";
    }
}
</script>

</body>
</html>

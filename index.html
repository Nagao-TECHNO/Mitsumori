<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>見積もりシステム</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; }
        .box { background: white; padding: 25px; border-radius: 12px; max-width: 500px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .row { display: flex; padding: 8px 0; border-bottom: 1px solid #eee; }
        .label { width: 100px; color: #555; font-weight: bold; }
        input, button { width: 100%; padding: 12px; margin-top: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
<div class="box">
    <h3>部品見積もり検索</h3>
    <div id="login-ui">
        <input type="text" id="pass" placeholder="合言葉（nagao1〜4）">
        <button onclick="login()">ログイン</button>
    </div>
    <div id="search-ui" style="display:none;">
        <input type="text" id="code" placeholder="品番を入力">
        <button onclick="search()">検索</button>
        <div id="res" style="margin-top:20px; display:none;"></div>
    </div>
</div>

<script>
    // 16,000件のデータを統合する場所
    const DATA = [
        { car_hinban: "44320-35620", hin_sname: "P/Sﾎﾟﾝﾌﾟ", A: 8000, B: 8000, C: 9000, D: 10000, E: 10000, remark: "2年/2万㎞保証"}
    　  { car_hinban: "44320-12071", hin_sname: "P/Sﾎﾟﾝﾌﾟ", A: 11000, B: 11000, C:13000, D:13000, E:14000, remark: "2年/2万㎞保証"}
    　　{ car_hinban: "44310-32300", hin_sname:　"P/Sﾎﾟﾝﾌﾟ", A: 8000, B: 8000, C: 9000, D: 10000, E: 10000, remark: "2年/2万㎞保証"}
    　　{ car_hinban: "44310-36010", hin_sname:　"P/Sﾎﾟﾝﾌﾟ", A: 8000, B: 8000, C: 9000, D: 10000, E: 10000, remark: "2年/2万㎞保証"}

    function login() {
        const p = document.getElementById('pass').value.trim();
        if(["nagao1","nagao2","nagao3","nagao4"].includes(p)){
            localStorage.setItem('role', p);
            document.getElementById('login-ui').style.display = 'none';
            document.getElementById('search-ui').style.display = 'block';
        } else { alert("合言葉が違います"); }
    }

    function search() {
        const key = document.getElementById('code').value.trim();
        const role = localStorage.getItem('role');
        const item = DATA.find(d => d.car_hinban === key);
        
        if(item) {
            let price = "表示不可";
            if(role == "nagao1") price = "¥" + item.A.toLocaleString();
            if(role == "nagao2") price = "¥" + item.B.toLocaleString();
            if(role == "nagao3") price = "¥" + item.C.toLocaleString();
            if(role == "nagao4") price = "¥" + item.D.toLocaleString();

            document.getElementById('res').innerHTML = `
                <div class="row"><div class="label">品名:</div><b>${item.hin_sname}</b></div>
                <div class="row"><div class="label">品番:</div><b>${item.car_hinban}</b></div>
                <div class="row"><div class="label">価格:</div><b>${price}</b></div>
                <div class="row"><div class="label">保証:</div><b>${item.remark}</b></div>
                <div class="row"><div class="label">適合:</div><b>${item.compat}</b></div>
            `;
            document.getElementById('res').style.display = 'block';
        } else { alert("見つかりません"); }
    }
</script>
</body>
</html>

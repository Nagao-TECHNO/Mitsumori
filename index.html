<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自動見積もりシステム</title>
    <script src="data.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background-color: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 480px; box-sizing: border-box; }
        h1 { font-size: 20px; color: #333; text-align: center; margin-bottom: 24px; font-weight: bold; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #555; font-weight: 600; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; box-sizing: border-box; transition: border-color 0.2s; }
        input:focus { border-color: #007bff; outline: none; }
        button { width: 100%; padding: 14px; background-color: #007bff; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.2s; }
        button:hover { background-color: #0056b3; }
        .error { color: #dc3545; font-size: 14px; margin-top: 8px; display: none; font-weight: bold; background-color: #f8d7da; padding: 10px; border-radius: 6px; }
        .result-box { margin-top: 25px; padding: 20px; background-color: #f8f9fa; border-radius: 8px; border: 1px solid #e9ecef; display: none; }
        .result-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #edf2f7; font-size: 15px; }
        .result-row:last-child { border-bottom: none; }
        .result-label { color: #666; }
        .result-value { font-weight: bold; color: #2d3748; }
        .price-dest { color: #007bff; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>自動見積もりシステム</h1>
    
    <div class="form-group">
        <label id="input-label" for="search-input">合言葉を入力してください</label>
        <input type="text" id="search-input" placeholder="例: ひらがな4文字">
    </div>
    
    <button id="action-btn" onclick="handleAction()">送信</button>
    <div id="error-msg" class="error"></div>

    <div id="result" class="result-box">
        <div class="result-row"><span class="result-label">品名</span><span class="result-value" id="res-name">-</span></div>
        <div class="result-row"><span class="result-label">品番</span><span class="result-value" id="res-code">-</span></div>
        <div class="result-row"><span class="result-label">保証期間</span><span class="result-value" id="res-warranty">-</span></div>
        <div class="result-row" style="background-color: #e3f2fd; margin: 5px -20px; padding: 10px 20px;"><span class="result-label" style="font-weight: bold; color: #0d47a1;">お見積り金額</span><span class="result-value" id="res-price" style="font-size: 18px; color: #0d47a1;">-</span></div>
    </div>
</div>

<script>
    let isUnlocked = false;

    function handleAction() {
        const input = document.getElementById('search-input').value.trim();
        const errorMsg = document.getElementById('error-msg');
        const resultBox = document.getElementById('result');

        errorMsg.style.display = 'none';

        if (!isUnlocked) {
            // ステップ1: 合言葉認証 (例として「ながお」)
            if (input === "ながお") {
                isUnlocked = true;
                document.getElementById('input-label').innerText = "純正品番を入力してください";
                const searchInput = document.getElementById('search-input');
                searchInput.value = "";
                searchInput.placeholder = "例: 44310-12090";
                document.getElementById('action-btn').innerText = "検索";
                resultBox.style.display = 'none';
            } else {
                errorMsg.innerText = "合言葉が違います。";
                errorMsg.style.display = 'block';
            }
        } else {
            // ステップ2: 品番検索
            if (!input) {
                errorMsg.innerText = "品番を入力してください。";
                errorMsg.style.display = 'block';
                return;
            }

            // 検索用にハイフンやスペースを除去して小文字にする
            const searchKey = input.replace(/[- ]/g, "").toLowerCase();
            
            // 外部の data.js（window.PRICE_DATABASE）から1秒で爆速検索
            const db = window.PRICE_DATABASE || {};
            const item = db[searchKey];

            if (item) {
                document.getElementById('res-name').innerText = item.name;
                document.getElementById('res-code').innerText = item.org;
                
                // 品名から保証期間を自動判定
                let warranty = "2年または2万km";
                if (item.name.includes("触媒")) {
                    warranty = "1年または1万km";
                }
                document.getElementById('res-warranty').innerText = warranty;
                
                // 単価計算（エクセルのA/B, C, D/Eを綺麗に表示）
                let priceText = `A/B: ¥${item.ab.toLocaleString()} / C: ¥${item.c.toLocaleString()} / D/E: ¥${item.de.toLocaleString()}`;
                document.getElementById('res-price').innerText = priceText;
                
                resultBox.style.display = 'block';
            } else {
                resultBox.style.display = 'none';
                errorMsg.innerText = "該当する品番が見つかりませんでした。";
                errorMsg.style.display = 'block';
            }
        }
    }

    // Enterキーでも検索できるようにする親切設計
    document.getElementById('search-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') { handleAction(); }
    });
</script>

</body>
</html>

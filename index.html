<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>見積もりシステム</title>
    <style>
        body { font-family: sans-serif; background: #eee; padding: 20px; }
        .box { background: white; padding: 25px; border-radius: 10px; max-width: 500px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .row { display: flex; padding: 10px 0; border-bottom: 1px solid #eee; }
        .label { width: 80px; color: #555; font-weight: bold; }
    </style>
</head>
<body>
<div class="box">
    <h3>見積もり検索</h3>
    <input type="text" id="code" placeholder="品番を入力" style="width:100%; padding:10px;">
    <button onclick="search()" style="width:100%; padding:10px; margin-top:10px; background:#007bff; color:white; border:none; cursor:pointer;">検索</button>
    <div id="res" style="margin-top:20px; display:none;"></div>
</div>

<script>
    // CSVから統合したデータセット（ここに全16,000件が入ります）
    const DATA = [
        { car_hinban: "44320-35620", hin_sname: "P/Sﾎﾟﾝﾌﾟ", agent_tanka: 7000, web_remark: "2年間又は2万km", compatible: "44320-12311" },
        { car_hinban: "43211-29026", hin_sname: "ﾌﾛﾝﾄﾅｯｸﾙ", agent_tanka: 28000, web_remark: "要ｺｱ返却", compatible: "43211-29026" }
    ];

    function search() {
        const val = document.getElementById('code').value.trim();
        const item = DATA.find(d => d.car_hinban === val);
        
        if(item) {
            document.getElementById('res').innerHTML = `
                <div class="row"><div class="label">品名:</div><b>${item.hin_sname}</b></div>
                <div class="row"><div class="label">品番:</div><b>${item.car_hinban}</b></div>
                <div class="row"><div class="label">価格:</div><b>¥${item.agent_tanka.toLocaleString()}</b></div>
                <div class="row"><div class="label">保証:</div><b>${item.web_remark}</b></div>
                <div class="row"><div class="label">適合:</div><b>${item.compatible}</b></div>
            `;
            document.getElementById('res').style.display = 'block';
        } else {
            alert("品番が見つかりません");
        }
    }
</script>
</body>
</html>
